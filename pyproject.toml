[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hts-bot-multi-servers"
version = "0.2.0"
description = "Multi-server Project Zomboid Discord bot with isolated Wings data, FriendHost rankings, RCON, whitelist and automation"
readme = "README.md"
authors = [{name = "Malaio/Erick"}]
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9,<4",
    "cryptography>=42,<50",
    "discord.py>=2.5,<3",
    "Pillow>=10,<13",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.urls]
Repository = "https://github.com/gamerplay20p5-dotcom/HTS-Bot-Multi-servers"
Documentation = "https://github.com/gamerplay20p5-dotcom/HTS-Bot-Multi-servers#readme"

[tool.setuptools.packages.find]
include = ["manguadu*"]

[tool.pytest.ini_options]
testpaths = ["tests_py"]
