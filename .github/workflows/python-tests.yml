name: Python tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          set -o pipefail
          python -m pip install -e '.[dev]' 2>&1 | tee install.log
      - name: Compile
        run: python -m compileall -q manguadu
      - name: Pytest
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee pytest.log

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-logs
          path: |
            install.log
            pytest.log
          if-no-files-found: warn
